<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>AR Camera — Marker Demo</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: transparent; font-family: Arial, Helvetica, sans-serif;
      }
      #arjs-video, body > video {
        z-index: 0 !important;
        background: transparent !important;
      }
      a-scene, canvas.a-canvas {
        z-index: 1 !important;
        background: transparent !important;
      }
      .ar-ui {
        position: fixed; z-index: 10; inset: 0; display: flex; flex-direction: column;
        justify-content: space-between; pointer-events: none;
        padding: max(4.4rem, calc(env(safe-area-inset-top) + 3.4rem)) 1rem max(1rem, env(safe-area-inset-bottom));
      }
      .brand-logo {
        position: absolute; top: max(.8rem, env(safe-area-inset-top)); left: 50%;
        width: min(42vw, 10.5rem); height: auto; transform: translateX(-50%);
        filter: drop-shadow(0 3px 8px rgba(0,0,0,.72));
      }
      .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      .back {
        pointer-events: auto; display: inline-grid; width: 3rem; height: 3rem;
        place-items: center; border: 1px solid rgba(255,255,255,.42);
        border-radius: 999px; color: #fff; background: rgba(10,10,10,.62);
        backdrop-filter: blur(14px); text-decoration: none; font-size: 1.55rem;
      }
      .badge {
        display: inline-flex; align-items: center; gap: .55rem; padding: .8rem 1rem;
        border: 1px solid rgba(255,255,255,.33); border-radius: 999px; color: #fff;
        background: rgba(10,10,10,.62); backdrop-filter: blur(14px);
        font-size: .82rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
      }
      .badge::before {
        width: .55rem; height: .55rem; border-radius: 50%; background: #ff5a1f;
        box-shadow: 0 0 0 5px rgba(255,90,31,.18); content: "";
      }
      .guide {
        align-self: center; width: min(78vw, 430px); aspect-ratio: 1;
        border: 2px solid rgba(255,255,255,.34); border-radius: 1rem;
        transition: opacity .2s ease, transform .2s ease;
      }
      .guide.found { opacity: 0; transform: scale(.94); }
      .bottom {
        align-self: center; width: min(92vw, 480px); padding: 1rem 1.2rem;
        border: 1px solid rgba(255,255,255,.3); border-radius: 1rem; color: #fff;
        background: rgba(10,10,10,.7); backdrop-filter: blur(16px); text-align: center;
      }
      .bottom strong { display: block; margin-bottom: .35rem; font-size: 1rem; }
      .bottom span { color: rgba(255,255,255,.72); font-size: .86rem; line-height: 1.4; }
      .capture {
        position: absolute; left: 50%; bottom: calc(max(1rem, env(safe-area-inset-bottom)) + 6.8rem);
        width: 4.5rem; height: 4.5rem; padding: 0; pointer-events: auto;
        transform: translateX(-50%); border: 4px solid rgba(255,255,255,.92);
        border-radius: 50%; background: rgba(12,12,12,.48); box-shadow: 0 4px 18px rgba(0,0,0,.32);
        backdrop-filter: blur(10px); cursor: pointer;
      }
      .capture::after {
        position: absolute; inset: .38rem; border-radius: 50%; background: #fff; content: "";
        transition: transform .12s ease, background .12s ease;
      }
      .capture:active::after { transform: scale(.86); background: #ff5a1f; }
      .capture:disabled { opacity: .55; }
      .capture[hidden] { display: none; }
      .corner {
        position: absolute; width: 2.4rem; height: 2.4rem;
        border-color: #ff5a1f; border-style: solid;
      }
      .c1 { top: 22%; left: 11%; border-width: 4px 0 0 4px; }
      .c2 { top: 22%; right: 11%; border-width: 4px 4px 0 0; }
      .c3 { bottom: 22%; left: 11%; border-width: 0 0 4px 4px; }
      .c4 { right: 11%; bottom: 22%; border-width: 0 4px 4px 0; }
      .found ~ .corner { opacity: 0; }
      @media (orientation: landscape) and (max-height: 540px) {
        .guide { width: min(46vh, 320px); }
        .bottom { width: auto; max-width: 55vw; }
        .c1, .c2 { top: 14%; }
        .c3, .c4 { bottom: 14%; }
      }
    </style>
    <script>
      AFRAME.registerComponent("marker-status", {
        init: function () {
          const status = document.querySelector("#status-copy");
          const guide = document.querySelector("#guide");
          const badge = document.querySelector("#tracking-badge");
          const model = document.querySelector("#cat-model-entity");
          const capture = document.querySelector("#capture-button");
          const logo = document.querySelector("#brand-logo");
          let modelReady = false;
          let markerVisible = false;

          const updateCapture = () => {
            capture.hidden = !(modelReady && markerVisible);
          };

          capture.addEventListener("click", async () => {
            const video = document.querySelector("#arjs-video") || document.querySelector("video");
            const arCanvas = document.querySelector("canvas.a-canvas");
            if (!video || !arCanvas || video.readyState < 2) return;

            capture.disabled = true;
            const rect = arCanvas.getBoundingClientRect();
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
            const width = Math.max(1, Math.round(rect.width * pixelRatio));
            const height = Math.max(1, Math.round(rect.height * pixelRatio));
            const output = document.createElement("canvas");
            output.width = width;
            output.height = height;
            const context = output.getContext("2d");

            const sourceWidth = video.videoWidth;
            const sourceHeight = video.videoHeight;
            const sourceRatio = sourceWidth / sourceHeight;
            const outputRatio = width / height;
            let sx = 0;
            let sy = 0;
            let sw = sourceWidth;
            let sh = sourceHeight;
            if (sourceRatio > outputRatio) {
              sw = sourceHeight * outputRatio;
              sx = (sourceWidth - sw) / 2;
            } else {
              sh = sourceWidth / outputRatio;
              sy = (sourceHeight - sh) / 2;
            }

            context.drawImage(video, sx, sy, sw, sh, 0, 0, width, height);
            context.drawImage(arCanvas, 0, 0, arCanvas.width, arCanvas.height, 0, 0, width, height);
            if (logo.complete && logo.naturalWidth) {
              const logoRect = logo.getBoundingClientRect();
              const scaleX = width / rect.width;
              const scaleY = height / rect.height;
              context.drawImage(
                logo,
                (logoRect.left - rect.left) * scaleX,
                (logoRect.top - rect.top) * scaleY,
                logoRect.width * scaleX,
                logoRect.height * scaleY
              );
            }

            const blob = await new Promise((resolve) => output.toBlob(resolve, "image/jpeg", .92));
            if (!blob) {
              capture.disabled = false;
              return;
            }

            const file = new File([blob], "lucky-cat-ar-photo.jpg", { type: "image/jpeg" });
            try {
              if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: "Lucky Cat AR photo" });
              } else {
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = file.name;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
              }
            } catch (error) {
              if (error.name !== "AbortError") {
                status.innerHTML = "<strong>Photo could not be saved</strong><span>Please try the shutter button again.</span>";
              }
            } finally {
              capture.disabled = false;
            }
          });

          model.addEventListener("model-loaded", () => {
            modelReady = true;
            updateCapture();
            if (markerVisible) {
              badge.textContent = "Target locked";
              status.innerHTML = "<strong>Lucky Cat found</strong><span>Move the paper and watch the cat follow.</span>";
            }
          });
          model.addEventListener("model-error", () => {
            capture.hidden = true;
            badge.textContent = "3D model failed";
            status.innerHTML = "<strong>Could not load the Lucky Cat</strong><span>Close this page, reopen it and try again.</span>";
          });
          this.el.addEventListener("markerFound", () => {
            markerVisible = true;
            updateCapture();
            guide.classList.add("found");
            badge.textContent = modelReady ? "Target locked" : "Loading 3D cat";
            status.innerHTML = modelReady
              ? "<strong>Lucky Cat found</strong><span>Move the paper and watch the cat follow.</span>"
              : "<strong>Target found</strong><span>The Lucky Cat is still loading…</span>";
          });
          this.el.addEventListener("markerLost", () => {
            markerVisible = false;
            updateCapture();
            guide.classList.remove("found");
            badge.textContent = "Looking for target";
            status.innerHTML = "<strong>Point at the printed target</strong><span>Keep the full black square inside the frame.</span>";
          });
        }
      });
    </script>
  </head>
  <body>
    <div class="ar-ui" aria-live="polite">
      <img class="brand-logo" id="brand-logo" src="./rewards-logo.png?v=6" alt="&amp;Rewards" />
      <div class="top">
        <a class="back" href="./index.html" aria-label="Close AR camera">×</a>
        <div class="badge" id="tracking-badge">Looking for target</div>
      </div>
      <div class="guide" id="guide" aria-hidden="true"></div>
      <button class="capture" id="capture-button" type="button" aria-label="Take AR photo" hidden></button>
      <div class="bottom" id="status-copy">
        <strong>Point at the printed target</strong>
        <span>Keep the full black square inside the frame.</span>
      </div>
      <i class="corner c1" aria-hidden="true"></i>
      <i class="corner c2" aria-hidden="true"></i>
      <i class="corner c3" aria-hidden="true"></i>
      <i class="corner c4" aria-hidden="true"></i>
    </div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="antialias: true; alpha: true; colorManagement: true; logarithmicDepthBuffer: true; preserveDrawingBuffer: true"
      arjs="sourceType: webcam; detectionMode: mono; patternRatio: 0.5; debugUIEnabled: false; trackingMethod: best;"
    >
      <a-assets timeout="30000">
        <a-asset-item id="cat-model" src="./lucky-lantern-cat-mobile.glb?v=6"></a-asset-item>
      </a-assets>
      <a-marker
        type="pattern"
        url="./ar-target.patt"
        marker-status
        emitevents="true"
        smooth="true"
        smooth-count="7"
        smooth-tolerance="0.01"
        smooth-threshold="3"
      >
        <a-gltf-model
          id="cat-model-entity"
          src="#cat-model"
          position="0 0.018 0"
          scale="3.6 3.6 3.6"
          rotation="0 180 0"
          animation="property: rotation; from: 0 168 0; to: 0 192 0; dir: alternate; dur: 2600; easing: easeInOutSine; loop: true"
        ></a-gltf-model>
        <a-ring
          position="0 0.015 0"
          rotation="-90 0 0"
          radius-inner="0.54"
          radius-outer="0.58"
          color="#ff5a1f"
          material="opacity: 0.9; transparent: true"
          animation="property: rotation; to: -90 0 360; dur: 9000; easing: linear; loop: true"
        ></a-ring>
        <a-circle
          position="0 0.006 0"
          rotation="-90 0 0"
          radius="0.48"
          color="#000000"
          material="opacity: 0.18; transparent: true"
        ></a-circle>
        <a-light type="ambient" color="#ffffff" intensity="1.6"></a-light>
        <a-light type="directional" color="#fff1dc" intensity="2.1" position="1 2 1"></a-light>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
