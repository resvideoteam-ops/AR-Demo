<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 2480 3508">
  <title>Printable AR camera target</title>
  <rect width="2480" height="3508" fill="#f5f2ea"/>
  <rect x="0" y="0" width="2480" height="42" fill="#ff5a1f"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <text x="220" y="255" font-size="58" font-weight="700" letter-spacing="8">AR MARKER DEMO</text>
    <text x="220" y="470" font-size="154" font-weight="800" letter-spacing="-6">POINT YOUR</text>
    <text x="220" y="630" font-size="154" font-weight="800" letter-spacing="-6">CAMERA HERE</text>
    <text x="220" y="742" font-size="43" fill="#5f5a53">Keep the full black square visible inside the camera frame.</text>
  </g>
  <rect x="330" y="915" width="1820" height="1820" rx="28" fill="#ffffff" stroke="#111111" stroke-width="10"/>
  <g transform="translate(440 1025)">
    <rect width="1600" height="1600" fill="#000000"/>
    <g transform="translate(400 400)">
      <rect width="800" height="800" fill="#ffffff"/>
      <circle cx="470" cy="365" r="230" fill="#ff5a1f"/>
      <path d="M87 92h245v116H203v197H87z" fill="#111111"/>
      <path d="M610 80h112v204H610z" fill="#111111"/>
      <path d="M515 510l225 188H430z" fill="#111111"/>
      <rect x="88" y="565" width="245" height="106" fill="#111111"/>
      <circle cx="210" cy="505" r="60" fill="#ff5a1f"/>
      <circle cx="475" cy="360" r="66" fill="#ffffff"/>
      <circle cx="475" cy="360" r="31" fill="#111111"/>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <circle cx="279" cy="2992" r="52" fill="#ff5a1f"/>
    <text x="279" y="3010" text-anchor="middle" font-size="44" font-weight="800">1</text>
    <text x="365" y="2984" font-size="42" font-weight="700">Open the AR demo on your phone</text>
    <text x="365" y="3040" font-size="34" fill="#6d6962">Allow camera access when prompted.</text>
    <circle cx="279" cy="3202" r="52" fill="#ff5a1f"/>
    <text x="279" y="3220" text-anchor="middle" font-size="44" font-weight="800">2</text>
    <text x="365" y="3194" font-size="42" font-weight="700">Point at the black square</text>
    <text x="365" y="3250" font-size="34" fill="#6d6962">Hold steady and the animated 3D object will appear.</text>
  </g>
</svg>
